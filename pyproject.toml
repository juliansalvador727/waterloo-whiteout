[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteout"
version = "0.1.0"
description = "Safety-first controller scaffold for Dominion Dynamics WHITEOUT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.8"]
mavlink = ["pymavlink>=2.4"]
mavproxy = ["MAVProxy>=1.8", "prompt-toolkit>=3"]
yaml = ["PyYAML>=6"]
dev = []
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyproj>=3.6",
    "opencv-python-headless>=4.8",
]

[project.scripts]
whiteout = "whiteout.main:main"
whiteout-dashboard = "whiteout.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whiteout.dashboard" = ["static/*.html"]

[tool.unittest]
start-directory = "tests"
